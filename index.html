<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Flex, Carousel & Form Practice</title>
    <!-- Nhúng Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng Font Awesome 6.5.2 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- BƯỚC 2: Navbar với Font Awesome -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- BƯỚC 3: Hero Section với Carousel -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/image1.jpg" class="d-block w-100 object-fit-cover" style="height: 400px;" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="images/image2.jpg" class="d-block w-100 object-fit-cover" style="height: 400px;" alt="Slide 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- BƯỚC 4: Section với Flexbox -->
    <div class="d-flex justify-content-center align-items-center bg-light py-5 shadow-sm">
        <h2 class="fw-bold text-secondary">Chào mừng đến với trang web của chúng tôi!</h2>
    </div>

    <!-- BƯỚC 5: Contact Form với Bootstrap Form -->
    <section class="container my-5" style="max-width: 600px;">
        <h3 class="mb-4 text-center fw-bold text-primary">Liên hệ với chúng tôi</h3>
        <form class="p-4 border rounded shadow-sm bg-white">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Tên của bạn</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập tên của bạn" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email của bạn" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label fw-semibold">Lời nhắn</label>
                <textarea class="form-control" id="message" rows="3" placeholder="Nhập nội dung liên hệ..."></textarea>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Gửi</button>
            </div>
        </form>
    </section>

    <!-- Footer thông tin bản quyền -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 MyWebsite. All rights reserved.</p>
        </div>
    </footer>

    <!-- Nhúng Bootstrap 5.3.3 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
